name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Tests and database queries
    runs-on: ubuntu-latest
    services:
      # Empty, throwaway Neo4j for scripts/smoke.js, which runs every real query against it.
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/ci-only-password
          NEO4J_server_memory_heap_max__size: 512M
        ports:
          - 7687:7687
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Database queries (scripts/smoke.js)
        run: node scripts/smoke.js
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: ci-only-password

  image:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cinestellar:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container answers its health check
        run: |
          docker run -d --name cs -p 8080:8080 -e NEO4J_PASSWORD=unused cinestellar:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then echo; docker rm -f cs; exit 0; fi
            sleep 1
          done
          docker logs cs
          exit 1
