name: Release

# Push a tag like v0.8.0 (matching "version" in package.json) to publish
# ghcr.io/<owner>/cinestellar for Intel and ARM and create the GitHub release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish image and release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Tag matches package.json
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$want" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($want)"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/009bob/cinestellar
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=Cinestellar
            org.opencontainers.image.licenses=GPL-3.0-or-later
          annotations: |
            org.opencontainers.image.title=Cinestellar
            org.opencontainers.image.description=Explore your Plex movie library as a graph of films, cast, crew, studios and franchises
            org.opencontainers.image.licenses=GPL-3.0-or-later
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub release with this version's changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v) == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## $version' section"
            exit 1
          fi
          {
            echo
            echo '```bash'
            echo "docker compose pull && docker compose up -d"
            echo '```'
            echo
            echo "Image: \`ghcr.io/009bob/cinestellar:${version}\`"
          } >> notes.md
          # Release assets can't start with a dot, so .env.example is attached as env.example.
          cp .env.example env.example
          # A tag like v0.9.0-rc.1 becomes a pre-release, so /releases/latest keeps pointing at a stable one.
          pre=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then pre=(--prerelease); fi
          # If the release was already made by hand on github.com (which also creates the tag),
          # fill it in instead of failing.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" "${pre[@]}" --title "Cinestellar $GITHUB_REF_NAME" --notes-file notes.md
            gh release upload "$GITHUB_REF_NAME" docker-compose.yml env.example --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${pre[@]}" --title "Cinestellar $GITHUB_REF_NAME" --notes-file notes.md \
              docker-compose.yml env.example
          fi
